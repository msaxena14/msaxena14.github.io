name: Build investigations

# Add, edit or delete a file in Investigations/ and push: this rebuilds
# investigations.html and the homepage teasers, then commits the result.
on:
  push:
    branches: [main]
    paths:
      - "Investigations/**"
      - "scripts/build_investigations.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-investigations
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild pages from Investigations/*.md
        run: python3 scripts/build_investigations.py

      - name: Commit regenerated pages
        run: |
          if git diff --quiet -- investigations.html index.html; then
            echo "No changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add investigations.html index.html
            git commit -m "Rebuild investigations pages"
            git push
          fi
